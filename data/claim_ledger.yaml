  route_grid: 40
  puff_receptor_x_m: 2000.0
  puff_threshold_kg_m3: 1.0e-8
  puff_initial_sigma_m: 1.0
  descent_mass_kg: 100.0
  descent_friction: 0.03
  descent_drag_area_m2: 0.45
  descent_rho_kg_m3: 1.2
  curve_max_g: 4.0
  bank_deg: 55.0
