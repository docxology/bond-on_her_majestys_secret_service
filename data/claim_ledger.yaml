# Claim ledger — PIZ GLORIA (on_her_majestys_secret_service)
# Registers sourced numeric/parametric claims for evidence-registry validation.

claims:
  - id: "pg-dispersion-peak"
    statement: "Peak ground-level centreline concentration of the configured release"
    source: "src/on_her_majestys_secret_service/mission.py::run_scenario"
    derivation: "Gaussian plume model, computed"
    verifiable: true
  - id: "pg-isopleth-reach"
    statement: "Far-edge down-valley reach of the 1e-7 kg/m3 hazard isopleth"
    source: "src/on_her_majestys_secret_service/mission.py::run_scenario"
    derivation: "isopleth_distance bisection, computed"
    verifiable: true
  - id: "pg-route-safe"
    statement: "Planned alpine exfiltration route safe under the slope gate"
    source: "src/on_her_majestys_secret_service/mission.py::run_scenario"
    derivation: "Dijkstra slope-gated planner over analytic terrain"
    verifiable: true
  - id: "pg-bray-cover"
    statement: "Bray persona aggregate cover-risk score and verdict"
    source: "src/on_her_majestys_secret_service/mission.py::run_scenario"
    derivation: "weighted additive risk model, computed"
    verifiable: true

model_parameters:
  release_rate_kg_s: 0.05
  wind_speed_m_s: 4.0
  release_height_m: 25.0
  stability_class: "C"
  valley_depth_m: 400.0
  floor_wind_ratio: 0.6
  isopleth_threshold_kg_m3: 1.0e-7
  route_max_slope_deg: 30.0
  route_grid: 40
  cover_weights:
    documentation: 0.25
    linguistic_fit: 0.20
    behavioural_consistency: 0.15
    social_footprint: 0.15
    forensic_overlap: 0.10
    physiognomy: 0.08
    pecuniary_consistency: 0.07
